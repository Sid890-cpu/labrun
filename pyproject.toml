[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labrun"
version = "0.1.0"
description = "Sandboxed, reproducible experiment runner for autonomous research agents"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
labrun = "labrun.cli:main"

[tool.setuptools]
packages = ["labrun"]
